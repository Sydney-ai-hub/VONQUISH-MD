
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VONQUISH MD | Pairing</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at top, #32105c, #090611 65%);
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 25px;
      border: 1px solid #813bce;
      border-radius: 22px;
      background: #130e20;
      box-shadow: 0 0 35px #7023a455;
      text-align: center;
    }

    .logo {
      color: #c58aff;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    p { color: #c8bdd6; line-height: 1.6; }

    input {
      width: 100%;
      padding: 15px;
      margin: 14px 0;
      border: 1px solid #7541a0;
      border-radius: 10px;
      background: #090611;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, #7626bd, #b04cff);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #241637;
      overflow-wrap: anywhere;
    }

    #code {
      display: block;
      color: #d4a2ff;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 3px;
      margin: 12px 0;
    }

    .hidden { display: none; }
    small { color: #9e91ac; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">VONQUISH MD</div>
    <p>Connect your WhatsApp account using a secure pairing code.</p>

    <form id="pairForm">
      <input
        id="phone"
        type="tel"
        placeholder="2547XXXXXXXX"
        autocomplete="tel"
        required
      >
      <button id="submit" type="submit">GET PAIRING CODE</button>
    </form>

    <div id="result" class="hidden" aria-live="polite">
      <p id="message"></p>
      <span id="code"></span>
      <small>Never share your pairing code with anyone.</small>
    </div>

    <p><small>Only connect a WhatsApp account you own or are authorised to use.</small></p>
  </main>

  <script>
    const form = document.getElementById("pairForm");
    const button = document.getElementById("submit");
    const result = document.getElementById("result");
    const message = document.getElementById("message");
    const code = document.getElementById("code");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "PLEASE WAIT...";
      result.classList.remove("hidden");
      message.textContent = "Requesting pairing code...";
      code.textContent = "";

      try {
        const response = await fetch("/api/pair", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            phone: document.getElementById("phone").value
          })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.error || "Request failed");

        message.textContent = data.instructions;
        code.textContent = data.pairingCode;
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "GET PAIRING CODE";
      }
    });
  </script>
</body>
</html>
